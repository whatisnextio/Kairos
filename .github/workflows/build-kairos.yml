name: Kairos — Build & OTA

on:
  push:
    branches: [main]
    paths:
      - 'kairos/**'
      - '.github/workflows/build-kairos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kairos/**'
      - '.github/workflows/build-kairos.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kairos/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  build-web:
    name: Web build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: kairos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kairos/package-lock.json

      - name: Install
        run: npm ci

      - name: Vite build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: kairos-dist
          path: kairos/dist/
          retention-days: 7

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: build-web
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
    defaults:
      run:
        working-directory: kairos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kairos/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install
        run: npm ci

      - name: Vite build + Cap sync
        run: npm run cap:android

      - name: Make gradlew executable
        working-directory: kairos/android
        run: chmod +x gradlew

      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/kairos/android/app/release.jks"

      - name: Gradle build (release when keystore present, debug otherwise)
        working-directory: kairos/android
        run: |
          JKS="${{ github.workspace }}/kairos/android/app/release.jks"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -f "$JKS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kairos/android/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kairos-apk
          path: |
            kairos/android/app/build/outputs/apk/release/app-release.apk
            kairos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    needs: build-web
    defaults:
      run:
        working-directory: kairos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kairos/package-lock.json

      - name: Install Node deps
        run: npm ci

      - name: Vite build + Cap sync
        run: npm run cap:ios

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod install
        working-directory: kairos/ios/App
        run: pod install

      - name: Build iOS (unsigned)
        working-directory: kairos/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty || true

  ota-deploy:
    name: OTA deploy (Capgo)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: kairos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kairos/package-lock.json

      - name: Install
        run: npm ci

      - name: Vite build
        run: npm run build

      - name: Upload to Capgo
        run: |
          if [ -z "$CAPGO_API_KEY" ]; then
            echo "CAPGO_API_KEY not configured — skipping OTA deploy"
            exit 0
          fi
          npx @capgo/cli@latest bundle upload --apikey "$CAPGO_API_KEY" --channel production
        env:
          CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
