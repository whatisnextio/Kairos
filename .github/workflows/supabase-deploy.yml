name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref
        required: true
        default: kvksenmykcnlwnaokamg
      sync_edge_secrets:
        description: Set Edge Function secrets from GitHub secrets
        required: true
        type: boolean
        default: false
      deploy_migrations:
        description: Push database migrations
        required: true
        type: boolean
        default: false
      deploy_functions:
        description: Deploy all Supabase Edge Functions
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}

jobs:
  deploy:
    name: Deploy Supabase assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate deployment inputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYNC_EDGE_SECRETS: ${{ inputs.sync_edge_secrets }}
          DEPLOY_MIGRATIONS: ${{ inputs.deploy_migrations }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required to deploy Supabase assets."
            missing=1
          fi
          if [ "$DEPLOY_MIGRATIONS" = "true" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required when deploy_migrations is true."
            missing=1
          fi
          if [ "$SYNC_EDGE_SECRETS" = "true" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is required when sync_edge_secrets is true."
            missing=1
          fi
          if [ "$DEPLOY_MIGRATIONS" != "true" ] && [ "$DEPLOY_FUNCTIONS" != "true" ] && [ "$SYNC_EDGE_SECRETS" != "true" ]; then
            echo "::error::At least one deployment action must be enabled."
            missing=1
          fi
          exit "$missing"

      - name: Show Supabase CLI version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase@latest --version

      - name: Sync Edge Function secrets
        if: inputs.sync_edge_secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx supabase@latest secrets set \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: inputs.deploy_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          npx supabase@latest db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Deploy Edge Functions
        if: inputs.deploy_functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase@latest functions deploy \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
